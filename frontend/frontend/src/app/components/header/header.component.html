<header class="main-header">
  <div class="container">
    <a routerLink="/" class="logo">FreelaHub</a>
    <nav>
      <ul>
        <li><a routerLink="/" fragment="sobre">Sobre</a></li>
        <li><a routerLink="/" fragment="planos">Planos</a></li>
        
        <li><a routerLink="/projects">Ver Projetos</a></li>

        <ng-container *ngIf="!isLoggedIn">
          <li><a routerLink="/login">Login</a></li>
          <li><a routerLink="/selecao-cadastro" class="cta-button">Cadastre-se</a></li>
        </ng-container>

        <ng-container *ngIf="isLoggedIn">
          <li *ngIf="isCompany">
            <a routerLink="/projects/create" class="cta-button">Postar Projeto</a>
          </li>
          
          <li>
            <a (click)="onLogout()" class="logout-link">Sair</a>
          </li>
        </ng-container>
      </ul>
    </nav>
  </div>
</header>
