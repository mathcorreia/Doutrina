<div class="login-container">
  <div class="login-box">
    <h2>Login</h2>
    <p>Acesse sua conta para continuar.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" formControlName="email" required placeholder="Digite seu e-mail" />
      </div>

      <div class="input-group">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" formControlName="password" required placeholder="Digite sua senha" />
      </div>

      <div *ngIf="errorMessage" class="alert alert-error">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn" [disabled]="loginForm.invalid">Entrar</button>
    </form>
    <p class="signup-link">
      Não tem uma conta?
      <a routerLink="/selecao-cadastro" class="btn">Cadastre-se</a>
    </p>
  </div>
</div>
