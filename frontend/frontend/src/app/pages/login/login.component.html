<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - FreelaHub</title>
  <link rel="stylesheet" href="../../../styles.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1>
        <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">FreelaHub</a>
      </h1>
    </div>
  </header>

  <main class="container">
    <h2>Login</h2>
    <form action="login.php" method="post" autocomplete="on">
      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required placeholder="Digite seu e-mail" />

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" required placeholder="Digite sua senha" />

      <button type="submit" class="btn">Entrar</button>
    </form>
    <p>Não tem uma conta? <a href="selecaoCadastro.html">Cadastre-se</a></p>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 FreelaHub - Todos os direitos reservados.</p>
    </div>
  </footer>
</body>
</html>
