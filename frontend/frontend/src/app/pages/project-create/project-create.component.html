<div class="form-page-wrapper">
  <div class="form-container">
    <h2>Publicar Novo Projeto</h2>
    <p>Descreva seu projeto para que os melhores freelancers possam encontrá-lo.</p>
    
    <form [formGroup]="projectForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="title">Título do Projeto</label>
        <input type="text" id="title" formControlName="title" class="form-control" placeholder="Ex: Criação de um website para minha loja">
      </div>

      <div class="form-group">
        <label for="description">Descrição Detalhada</label>
        <textarea id="description" formControlName="description" rows="8" class="form-control" placeholder="Descreva os objetivos, escopo e requisitos do seu projeto..."></textarea>
      </div>

      <div class="form-group">
        <label for="budget">Orçamento (R$)</label>
        <input type="number" id="budget" formControlName="budget" class="form-control" placeholder="5000">
      </div>

      <div class="form-group">
        <label for="skills">Habilidades Necessárias</label>
        <input type="text" id="skills" formControlName="skills" class="form-control" placeholder="Ex: Angular, PHP, Laravel, Design Gráfico">
        <small>Separe as habilidades por vírgula.</small>
      </div>

      <div *ngIf="errorMessage" class="feedback-error">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="feedback-success"> {{ successMessage }}
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="projectForm.invalid">Publicar Projeto</button>
    </form>
  </div>
</div>
