<div class="selection-page-wrapper">
  <div class="selection-container text-center">
    <h2>Sou um...</h2>
    <p class="subtitle">Selecione o seu tipo de perfil para começarmos.</p>
    
    <div class="options">
      <a [routerLink]="['/signup', 'freelancer']" class="option-card">
        <img src="https://placehold.co/150x150/3a7bd5/FFFFFF?text=Freelancer" alt="Ilustração de um freelancer">
        <h3>Freelancer</h3>
        <p>Quero encontrar projetos e mostrar meu talento.</p>
      </a>

      <a [routerLink]="['/signup', 'company']" class="option-card">
        <img src="https://placehold.co/150x150/005c97/FFFFFF?text=Empresa" alt="Ilustração de uma empresa">
        <h3>Empresa</h3>
        <p>Quero contratar profissionais para os meus projetos.</p>
      </a>
    </div>

    <div class="login-redirect mt-4">
      <p>Já tem uma conta? <a routerLink="/login">Faça login</a></p>
    </div>
  </div>
</div>
