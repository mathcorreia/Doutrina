<div class="container form-container">
  <h1>Crie sua Conta</h1>
  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="user_type">Eu sou:</label>
      <select formControlName="user_type" id="user_type">
        <option value="freelancer">Freelancer (Quero trabalhar)</option>
        <option value="company">Empresa (Quero contratar)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="name">Nome Completo</label>
      <input type="text" id="name" formControlName="name">
    </div>

    <div class="form-group" *ngIf="userType?.value === 'freelancer'">
      <label for="cpf">CPF</label>
      <input type="text" id="cpf" formControlName="cpf">
    </div>

    <div class="form-group" *ngIf="userType?.value === 'company'">
      <label for="cnpj">CNPJ</label>
      <input type="text" id="cnpj" formControlName="cnpj">
    </div>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" formControlName="email">
    </div>

    <div class="form-group">
      <label for="password">Senha (mínimo 8 caracteres)</label>
      <input type="password" id="password" formControlName="password">
    </div>

    <div class="form-group">
      <label for="password_confirmation">Confirmar Senha</label>
      <input type="password" id="password_confirmation" formControlName="password_confirmation">
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

    <button type="submit" [disabled]="signupForm.invalid">Cadastrar</button>
  </form>
</div>
