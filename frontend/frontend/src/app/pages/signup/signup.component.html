<div class="signup-page-wrapper">
  <div class="signup-container">
    <h1>Crie sua Conta</h1>
    <p>Preencha os campos para se juntar à FreelaHub.</p>

    <form *ngIf="signupForm" [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="user_type">Eu sou:</label>
        <select formControlName="user_type" id="user_type" class="form-control">
          <option value="freelancer">Freelancer (Quero trabalhar)</option>
          <option value="company">Empresa (Quero contratar)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="name">Nome Completo</label>
        <input type="text" id="name" formControlName="name" class="form-control" placeholder="Seu nome">
      </div>

      <div class="form-group" *ngIf="userType.value === 'freelancer'">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" formControlName="cpf" class="form-control" placeholder="000.000.000-00">
      </div>

      <div class="form-group" *ngIf="userType.value === 'company'">
        <label for="cnpj">CNPJ</label>
        <input type="text" id="cnpj" formControlName="cnpj" class="form-control" placeholder="00.000.000/0000-00">
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" formControlName="email" class="form-control" placeholder="seu@email.com">
      </div>

      <div class="form-group">
        <label for="password">Senha (mínimo 8 caracteres)</label>
        <input type="password" id="password" formControlName="password" class="form-control">
      </div>

      <div class="form-group">
        <label for="password_confirmation">Confirmar Senha</label>
        <input type="password" id="password_confirmation" formControlName="password_confirmation" class="form-control">
        <div *ngIf="signupForm.errors?.['passwordMismatch'] && (signupForm.get('password_confirmation')?.touched)" class="alert alert-error">
          As senhas não conferem.
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

      <button type="submit" class="submit-btn" [disabled]="signupForm.invalid">Cadastrar</button>
    </form>
  </div>
</div>
