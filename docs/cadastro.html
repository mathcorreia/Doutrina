<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro - FreelaHub</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="container">
      <h1><a href="index.html" style="color: white; text-decoration: none;">FreelaHub</a></h1>
      <nav>
        <ul>
          <li><a href="index.html#sobre">Sobre</a></li>
          <li><a href="index.html#servicos">Serviços</a></li>
          <li><a href="index.html#planos">Planos</a></li>
          <li><a href="index.html#contato">Contato</a></li>
          <li><a href="login.html" class="btn">Entrar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h2>Cadastre-se no FreelaHub</h2>
      <p>Conecte-se a oportunidades incríveis como freelancer ou cliente.</p>
    </div>
  </section>

  <main class="container">
    <form action="#" method="POST" onsubmit="return validarCadastro()">
      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" required minlength="6" placeholder="Crie uma senha">

      <label for="confirmar-senha">Confirmar Senha:</label>
      <input type="password" id="confirmar-senha" name="confirmar_senha" required minlength="6" placeholder="Repita a senha">

      <button type="submit" class="btn">Cadastrar</button>
    </form>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 FreelaHub - Todos os direitos reservados.</p>
    </div>
  </footer>

  <script>
    function validarCadastro() {
      const senha = document.getElementById("senha").value;
      const confirmar = document.getElementById("confirmar-senha").value;
      if (senha !== confirmar) {
        alert("As senhas não coincidem!");
        return false;
      }
      alert("Cadastro enviado com sucesso!");
      return true;
    }
  </script>

</body>
</html>
