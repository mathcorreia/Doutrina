<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - FreelaHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>FreelaHub</h1>
      <nav>
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contato.html" class="btn">Contato</a></li>
          <li><a href="paginaLogin.html">Login</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="container">
    <h2>Fale Conosco</h2>
    <form>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">

      <label for="mensagem">Mensagem:</label>
      <textarea id="mensagem" name="mensagem" required placeholder="Digite sua mensagem"></textarea>

      <button type="submit" class="btn">Enviar</button>
    </form>
  </main>
  <footer>
    <div class="container">
      <p>&copy; 2025 FreelaHub - Todos os direitos reservados.</p>
    </div>
  </footer>
</body>
</html>
