<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro - FreelaHub</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="container">
      <h1><a href="index.html" style="color: white; text-decoration: none;">FreelaHub</a></h1>
      <nav>
        <ul>
          <li><a href="index.html#sobre">Sobre</a></li>
          <li><a href="index.html#servicos">Serviços</a></li>
          <li><a href="index.html#planos">Planos</a></li>
          <li><a href="index.html#contato">Contato</a></li>
          <li><a href="paginaLogin.html" class="btn">Entrar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h2>Cadastre-se no FreelaHub</h2>
      <p>Conecte-se a oportunidades incríveis como freelancer ou cliente.</p>
    </div>
  </section>

  <main class="container">
    <form onsubmit="return validarCadastroFreelancer()">
  <label for="nome">Nome completo:</label>
  <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">

  <label for="cpf">CPF:</label>
  <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00" pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}">

  <label for="nascimento">Data de Nascimento:</label>
  <input type="date" id="nascimento" name="nascimento" required>

  <label for="email">E-mail:</label>
  <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">

  <label for="senha">Senha:</label>
  <input type="password" id="senha" name="senha" required minlength="6" placeholder="Crie uma senha">

  <label for="confirmar-senha">Confirmar Senha:</label>
  <input type="password" id="confirmar-senha" name="confirmar_senha" required minlength="6" placeholder="Repita a senha">

  <button type="submit" class="btn">Cadastrar</button>
</form>

  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 FreelaHub - Todos os direitos reservados.</p>
    </div>
  </footer>

  <script>
  function calcularIdade(dataNasc) {
    const hoje = new Date();
    const nascimento = new Date(dataNasc);
    let idade = hoje.getFullYear() - nascimento.getFullYear();
    const mes = hoje.getMonth() - nascimento.getMonth();
    if (mes < 0 || (mes === 0 && hoje.getDate() < nascimento.getDate())) {
      idade--;
    }
    return idade;
  }

  function validarCadastroFreelancer() {
    const senha = document.getElementById("senha").value;
    const confirmar = document.getElementById("confirmar-senha").value;
    const nascimento = document.getElementById("nascimento").value;

    if (senha !== confirmar) {
      alert("As senhas não coincidem!");
      return false;
    }

    const idade = calcularIdade(nascimento);
    if (idade < 18) {
      alert("Você precisa ter pelo menos 18 anos para se cadastrar.");
      return false;
    }

    alert("Cadastro enviado com sucesso!");
    return true;
  }
</script>

</body>
</html>
